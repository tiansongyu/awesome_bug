name: Windows x64 package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Rust core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint platform-neutral runtime
        run: cargo clippy -p bug-runtime --all-targets --locked -- -D warnings

      - name: Lint Windows host's platform-neutral library
        run: cargo clippy -p bug-windows --lib --locked -- -D warnings

      - name: Test platform-neutral runtime
        run: cargo test -p bug-runtime --locked

      - name: Test Windows host's platform-neutral library
        run: cargo test -p bug-windows --lib --locked

  windows-msvc:
    name: Windows x64 MSVC ZIP
    needs: rust-core
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache verified SDL archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-windows-deps/downloads
          key: sdl2-2.32.10-msvc-${{ hashFiles('scripts/build-windows-msvc.ps1') }}

      - name: Build, test, smoke, and package
        shell: pwsh
        run: ./scripts/build-windows-msvc.ps1 -UiSmoke

      - name: Verify ZIP, PE resources, and payload hashes
        id: package
        shell: pwsh
        run: |
          ./scripts/verify-windows-package.ps1
          $archive = "dist/cockroach-overlay-windows-x64.zip"
          $sha256 = (
              Get-FileHash -LiteralPath $archive -Algorithm SHA256
          ).Hash.ToLowerInvariant()
          "sha256=$sha256" >> $env:GITHUB_OUTPUT

      - name: Upload verified Windows package
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockroach-overlay-windows-x64
          path: |
            dist/cockroach-overlay-windows-x64.zip
            dist/cockroach-overlay-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Add artifact details to summary
        shell: pwsh
        run: |
          @"
          ### Windows x64 package

          - [Download artifact](${{ steps.upload.outputs.artifact-url }})
          - ZIP SHA-256: ``${{ steps.package.outputs.sha256 }}``
          - Toolchain: Rust 1.97.1, MSVC x86-64, SDL 2.32.10
          "@ >> $env:GITHUB_STEP_SUMMARY
