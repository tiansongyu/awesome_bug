name: macOS package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-native:
    name: macOS native ZIP
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Build, test, and package
        run: ./scripts/build-macos.sh

      - name: Verify archive checksum
        run: shasum -a 256 -c dist/*.zip.sha256

      - name: Upload macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockroach-overlay-macos-native
          path: |
            dist/cockroach-overlay-macos-*.zip
            dist/cockroach-overlay-macos-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
